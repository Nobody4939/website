<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bookmarklet Generator</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 18px;

        background: #0a0a0a;
        color: #fff;

        font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;

        max-width: 600px;
        margin-inline: auto;
    }

    .card {
        background: #161616;
        border: 1px solid #262626;
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 14px;
    }

    h1 {
        font-size: 20px;
        margin: 0 0 6px;
    }

    .subtitle {
        color: #888;
        font-size: 13px;
        line-height: 1.45;
        margin-bottom: 15px;
    }

    textarea {
        width: 100%;

        min-height: 280px;
        max-height: 70vh;

        resize: vertical;

        padding: 13px;

        border-radius: 10px;
        border: 1px solid #303030;

        background: #0d0d0d;
        color: #fff;

        outline: none;

        font-family:
            ui-monospace,
            SFMono-Regular,
            Menlo,
            Monaco,
            Consolas,
            monospace;

        font-size: 13px;
        line-height: 1.55;
    }

    textarea:focus {
        border-color: #555;
    }

    textarea::placeholder {
        color: #555;
    }

    .info {
        display: flex;
        justify-content: space-between;
        gap: 10px;

        color: #777;

        font-size: 12px;

        margin-top: 8px;
    }

    .generate {
        width: 100%;

        border: none;
        border-radius: 10px;

        padding: 12px;

        background: #fff;
        color: #000;

        font-size: 14px;
        font-weight: 650;

        cursor: pointer;

        margin-top: 14px;
    }

    .generate:active {
        transform: scale(.98);
    }

    #result {
        display: none;
    }

    .dragArea {
        text-align: center;
    }

    .dragHint {
        color: #888;
        font-size: 12px;
        margin-bottom: 12px;
    }

    /*
     * The actual draggable bookmarklet link.
     */
    #bookmarklet {
        display: inline-flex;

        align-items: center;
        justify-content: center;

        min-width: 170px;

        padding: 11px 18px;

        border-radius: 10px;

        background: #222;
        border: 1px solid #3a3a3a;

        color: #fff;

        text-decoration: none;

        font-size: 14px;
        font-weight: 600;

        cursor: grab;

        user-select: none;
        -webkit-user-select: none;

        box-shadow:
            0 5px 20px rgba(0,0,0,.35);

        transition:
            transform .15s ease,
            background .15s ease;
    }

    #bookmarklet:hover {
        background: #2b2b2b;
    }

    #bookmarklet:active {
        cursor: grabbing;
        transform: scale(.96);
    }

    .warning {
        margin-top: 13px;

        padding: 10px;

        border-radius: 9px;

        background: #1d1d1d;

        color: #999;

        font-size: 12px;
        line-height: 1.45;
    }

    .codeSize {
        margin-top: 10px;

        color: #666;

        font-size: 11px;
        text-align: center;

        word-break: break-all;
    }
</style>
</head>

<body>

<div class="card">

    <h1>Bookmarklet Generator</h1>

    <div class="subtitle">
        Enter JavaScript below and generate a bookmarklet you can
        drag directly into your browser's bookmark bar.
    </div>

    <textarea
        id="code"
        spellcheck="false"
        placeholder="// Put your JavaScript here

alert('Hello!');

// Multiline code is supported.
// Large scripts are supported too."
    ></textarea>

    <div class="info">
        <span id="charCount">0 characters</span>
        <span id="lineCount">0 lines</span>
    </div>

    <button
        class="generate"
        id="generate">
        Generate Bookmarklet
    </button>

</div>


<div class="card" id="result">

    <div class="dragArea">

        <div class="dragHint">
            Drag this button to your bookmark bar
        </div>

        <a
            id="bookmarklet"
            href="#">
            ★ Drag Me
        </a>

        <div class="codeSize" id="codeSize"></div>

        <div class="warning">
            The generated bookmark executes JavaScript on the
            current webpage. Only use code you trust.
        </div>

    </div>

</div>


<script>

(function () {

    const textarea =
        document.getElementById("code");

    const generate =
        document.getElementById("generate");

    const result =
        document.getElementById("result");

    const bookmark =
        document.getElementById("bookmarklet");

    const charCount =
        document.getElementById("charCount");

    const lineCount =
        document.getElementById("lineCount");

    const codeSize =
        document.getElementById("codeSize");


    /*
     * Live statistics
     */

    function updateStats() {

        const code = textarea.value;

        charCount.textContent =
            code.length.toLocaleString() +
            " characters";

        lineCount.textContent =
            (code ? code.split(/\r\n|\r|\n/).length : 0) +
            " lines";
    }

    textarea.addEventListener(
        "input",
        updateStats
    );

    updateStats();


    /*
     * Generate bookmarklet
     *
     * The user's JavaScript is placed inside an
     * immediately-invoked function.
     *
     * encodeURIComponent() isn't used on the
     * JavaScript itself because the bookmarklet
     * needs to execute as JavaScript rather than
     * becoming a URL-encoded string.
     */

    function createBookmarklet(code) {

        /*
         * Remove a possible BOM.
         */
        code = code.replace(/^\uFEFF/, "");

        /*
         * Wrap user code.
         *
         * The void operator makes the bookmarklet
         * return undefined, preventing the browser
         * from replacing the current page with a
         * returned string.
         */
        return "javascript:(()=>{"
            + code
            + "\n})()";
    }


    /*
     * Generate
     */

    generate.addEventListener(
        "click",
        function () {

            const code = textarea.value;

            if (!code.trim()) {

                textarea.focus();

                return;
            }

            const bookmarklet =
                createBookmarklet(code);

            /*
             * Set the href directly.
             *
             * This is what makes the <a> element
             * draggable into the browser bookmark bar.
             */
            bookmark.href = bookmarklet;

            codeSize.textContent =
                bookmarklet.length.toLocaleString() +
                " characters in generated bookmarklet";

            result.style.display = "block";

            result.scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });
        }
    );

})();

</script>

</body>
</html>
