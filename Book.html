            <button onclick="convertBookmarklet()" class="w-full lg:w-auto lg:px-8 py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold text-sm shadow-xl shadow-indigo-600/30 transition transform active:scale-[0.98] flex items-center justify-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>

    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-slate-800 border border-slate-700 text-slate-100 text-xs px-4 py-2.5 rounded-xl shadow-2xl opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center space-x-2">
        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
        <span id="toastMsg">Success</span>
    </div>

    <!-- JavaScript Logic -->
    <script>
        function loadSample() {
            const sample = "javascript:(function(){let title=document.title;let meta=document.querySelector('meta[name=\"description\"]');alert('Title: '+title+'\\nDesc: '+(meta?meta.content:'None'));})();";
            document.getElementById('inputCode').value = sample;
            convertBookmarklet();
            showToast("Sample loaded successfully!");
        }

        function clearInput() {
            document.getElementById('inputCode').value = '';
            document.getElementById('outputCode').value = '';
            document.getElementById('copyBtn').disabled = true;
            showToast("Cleared inputs");
        }

        function safeDecode(str) {
            // Remove leading 'javascript:' or 'data:text/javascript,...'
            let cleaned = str.trim();
            if (/^javascript:/i.test(cleaned)) {
                cleaned = cleaned.replace(/^javascript:/i, '').trim();
            }

            // Iteratively decode URI components while handling malformed sequences gracefully
            let decoded = cleaned;
            try {
                let prev;
                let iterations = 0;
                do {
                    prev = decoded;
                    // Replace percent-encoded characters safely or decode
                    decoded = decodeURIComponent(decoded.replace(/%(?![0-9A-Fa-f]{2})/g, '%25'));
                    iterations++;
                } while (decoded !== prev && iterations < 5);
            } catch (e) {
                // Fallback decode piece by piece if general decode fails
                decoded = cleaned.replace(/%([0-9A-Fa-f]{2})/g, (match, p1) => {
                    try {
                        return String.fromCharCode(parseInt(p1, 16));
                    } catch (err) {
                        return match;
                    }
                });
            }
            return decoded;
        }

        function convertBookmarklet() {
            let raw = document.getElementById('inputCode').value.trim();
            if (!raw) {
                showToast("Please enter or paste a bookmarklet code first!");
                return;
            }

            try {
                let decoded = safeDecode(raw);

                // If wrapped in immediate invocation like (function(){...})() or void(function(){...}()),
                // let's check if js_beautify formats it correctly.
                if (typeof js_beautify === 'undefined') {
                    throw new Error("Beautifier library failed to load. Check your internet connection.");
                }

                let formatted = js_beautify(decoded, {
                    indent_size: 4,
                    space_in_empty_paren: false,
                    preserve_newlines: true,
                    max_preserve_newlines: 2,
                    unescape_strings: true,
                    jslint_happy: false,
                    end_with_newline: true,
                    wrap_line_length: 80,
                    brace_style: "collapse"
                });

                document.getElementById('outputCode').value = formatted;
                document.getElementById('copyBtn').disabled = false;
                showToast("Bookmarklet successfully cleaned & beautified!");
            } catch (err) {
                document.getElementById('outputCode').value = "Error parsing code: " + err.message + "\n\nRaw Decoded Attempt:\n" + safeDecode(raw);
                showToast("Error processing code. Check syntax.");
            }
        }

        function copyOutput() {
            const outputText = document.getElementById('outputCode').value;
            if (!outputText) return;

            const textarea = document.createElement('textarea');
            textarea.value = outputText;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast("Copied to clipboard!");
            } catch (err) {
                showToast("Failed to copy text");
            }
            document.body.removeChild(textarea);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
